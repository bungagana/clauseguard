name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "SPACE_URL variable not set, skipping"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 "${SPACE_URL%/}/health"
