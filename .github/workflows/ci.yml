name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clauseguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            clauseguard/requirements-ci.txt
            clauseguard/requirements-runtime.txt
      - run: pip install -r requirements-ci.txt
      - run: >
          python -m pytest -q -x
          --deselect tests/test_adversarial_fixtures.py::test_generator_is_deterministic
          --deselect tests/test_icd10_coder.py::test_wilson_interval_known_values
        env:
          GEMINI_API_KEY: ""
          GEMINI_API_KEYS: ""
          CG_ADMIN_TOKEN: ""

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clauseguard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clauseguard-web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
