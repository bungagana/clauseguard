<svg viewBox="0 0 1200 560" role="img" aria-label="Alur pengguna ClauseGuard: dari halaman depan, memilih mode demo atau produksi, mengobrol, menerima jawaban berbukti pasal, lalu mengonfirmasi aksi bila ada." xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:Arial,sans-serif" color="#14213D">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="20" y="40" width="200" height="80" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="120" y="75" text-anchor="middle" font-size="14" font-weight="700">Halaman Depan</text>
  <text x="120" y="95" text-anchor="middle" font-size="11" fill="#6B7280">ClauseGuard</text>

  <line x1="220" y1="80" x2="300" y2="80" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="10" width="40" height="140" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="320" y="86" text-anchor="middle" font-size="11" fill="#6B7280" transform="rotate(-90 320 86)">pilih mode</text>

  <rect x="380" y="20" width="220" height="80" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="490" y="50" text-anchor="middle" font-size="13" font-weight="700">"Lihat Demo"</text>
  <text x="490" y="70" text-anchor="middle" font-size="11" fill="#6B7280">pilih persona siap pakai</text>
  <text x="490" y="86" text-anchor="middle" font-size="11" fill="#6B7280">(Rizky / Santoso / Dewi)</text>

  <rect x="380" y="120" width="220" height="80" rx="10" fill="#3A5ECF" fill-opacity="0.08" stroke="#3A5ECF" stroke-width="2"/>
  <text x="490" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#3A5ECF">"Coba Sekarang"</text>
  <text x="490" y="170" text-anchor="middle" font-size="11" fill="#6B7280">upload polis sendiri</text>
  <text x="490" y="186" text-anchor="middle" font-size="11" fill="#6B7280">(mode produksi)</text>

  <line x1="340" y1="60" x2="380" y2="60" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="100" x2="380" y2="160" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="600" y1="60" x2="700" y2="130" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="160" x2="700" y2="150" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="90" width="220" height="90" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="810" y="125" text-anchor="middle" font-size="13" font-weight="700">Mengobrol</text>
  <text x="810" y="145" text-anchor="middle" font-size="11" fill="#6B7280">tanya cakupan, urus klaim,</text>
  <text x="810" y="160" text-anchor="middle" font-size="11" fill="#6B7280">tanya istilah, koreksi fakta</text>

  <line x1="920" y1="135" x2="1010" y2="135" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="965" y="125" text-anchor="middle" font-size="10" fill="#6B7280">jawab</text>

  <rect x="1010" y="90" width="170" height="90" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="1095" y="120" text-anchor="middle" font-size="13" font-weight="700">Jawaban</text>
  <text x="1095" y="140" text-anchor="middle" font-size="11" fill="#6B7280">+ kutipan pasal</text>
  <text x="1095" y="155" text-anchor="middle" font-size="11" fill="#6B7280">+ alasan</text>

  <line x1="1095" y1="180" x2="1095" y2="260" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1105" y="225" font-size="10" fill="#6B7280">jika klaim/banding</text>

  <path d="M1095 260 L1165 300 L1095 340 L1025 300 Z" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="1095" y="296" text-anchor="middle" font-size="11" font-weight="700">Perlu aksi?</text>
  <text x="1095" y="312" text-anchor="middle" font-size="9" fill="#6B7280">kirim klaim / banding</text>

  <line x1="1025" y1="300" x2="810" y2="300" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="915" y="290" text-anchor="middle" font-size="10" fill="#6B7280">tidak — lanjut tanya</text>
  <line x1="810" y1="300" x2="810" y2="180" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1095" y1="340" x2="1095" y2="410" stroke="#3A5ECF" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1105" y="380" font-size="10" fill="#3A5ECF" font-weight="700">ya</text>

  <rect x="975" y="410" width="240" height="90" rx="10" fill="#3A5ECF" fill-opacity="0.08" stroke="#3A5ECF" stroke-width="2.5"/>
  <text x="1095" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#3A5ECF">Konfirmasi</text>
  <text x="1095" y="460" text-anchor="middle" font-size="11" fill="#6B7280">klik "Confirm" — satu nonce,</text>
  <text x="1095" y="475" text-anchor="middle" font-size="11" fill="#6B7280">satu insurer per klik</text>

  <line x1="975" y1="455" x2="400" y2="455" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="445" text-anchor="middle" font-size="10" fill="#6B7280">tercatat di audit, kembali ke chat</text>

  <rect x="20" y="420" width="360" height="90" rx="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="200" y="450" text-anchor="middle" font-size="13" font-weight="700">Kartu proaktif</text>
  <text x="200" y="470" text-anchor="middle" font-size="11" fill="#6B7280">"Yang perlu kamu perhatikan"</text>
  <text x="200" y="486" text-anchor="middle" font-size="11" fill="#6B7280">muncul otomatis saat chat dibuka</text>
</svg>
