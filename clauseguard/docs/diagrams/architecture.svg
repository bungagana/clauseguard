<svg viewBox="0 0 1300 980" role="img" aria-label="Arsitektur ClauseGuard: pesan pengguna diproses Planner dan Fact Binder, dokumen diredaksi lalu diekstrak jadi tuple klausul bertipe, empat solver kode memutuskan, Permission Enforcer memilah aksi menjadi otomatis atau tiket manusia, lalu Composer menulis jawaban yang diverifikasi terhadap data solver, dengan audit log mencatat tiap langkah." xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:Arial,sans-serif" color="#14213D">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arrAudit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Row 1: input -->
  <rect x="80" y="20" width="260" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="210" y="50" text-anchor="middle" font-size="14" font-weight="700">Pesan Pengguna</text>
  <text x="210" y="68" text-anchor="middle" font-size="11" fill="#6B7280">teks bebas + dokumen opsional</text>

  <!-- Planner -->
  <line x1="210" y1="90" x2="210" y2="130" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="80" y="130" width="260" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="210" y="160" text-anchor="middle" font-size="14" font-weight="700">Planner</text>
  <text x="210" y="178" text-anchor="middle" font-size="11" fill="#6B7280">aturan + LLM → niat (intent)</text>

  <!-- Fact Binder -->
  <line x1="210" y1="200" x2="210" y2="240" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="60" y="240" width="300" height="80" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="210" y="268" text-anchor="middle" font-size="14" font-weight="700">Fact Binder</text>
  <text x="210" y="286" text-anchor="middle" font-size="11" fill="#6B7280">regex dulu; LLM menang bila fakta</text>
  <text x="210" y="300" text-anchor="middle" font-size="11" fill="#6B7280">menentukan verdict (nominal, status)</text>

  <!-- Document branch -->
  <rect x="440" y="20" width="260" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="570" y="50" text-anchor="middle" font-size="14" font-weight="700">Dokumen (PDF)</text>
  <text x="570" y="68" text-anchor="middle" font-size="11" fill="#6B7280">polis atau klaim</text>

  <line x1="570" y1="90" x2="570" y2="130" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="440" y="130" width="260" height="80" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="570" y="158" text-anchor="middle" font-size="14" font-weight="700">Redaksi Lokal</text>
  <text x="570" y="176" text-anchor="middle" font-size="11" fill="#6B7280">NIK/rekening/nama dihapus;</text>
  <text x="570" y="190" text-anchor="middle" font-size="11" fill="#6B7280">gerbang blokir jika masih bocor</text>

  <line x1="570" y1="210" x2="570" y2="240" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="440" y="240" width="260" height="80" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="570" y="268" text-anchor="middle" font-size="14" font-weight="700">Extractor</text>
  <text x="570" y="286" text-anchor="middle" font-size="11" fill="#6B7280">LLM karantina, hanya membaca</text>
  <text x="570" y="300" text-anchor="middle" font-size="11" fill="#6B7280">teks bersih → klausul bertipe</text>

  <!-- converge to tuple store -->
  <line x1="210" y1="320" x2="210" y2="360" stroke="currentColor" stroke-width="2"/>
  <line x1="570" y1="320" x2="570" y2="360" stroke="currentColor" stroke-width="2"/>
  <line x1="210" y1="360" x2="620" y2="360" stroke="currentColor" stroke-width="2"/>
  <line x1="420" y1="360" x2="420" y2="390" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="190" y="390" width="460" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="420" y="420" text-anchor="middle" font-size="14" font-weight="700">Tuple Klausul Bertipe</text>
  <text x="420" y="438" text-anchor="middle" font-size="11" fill="#6B7280">12 relasi tertutup, tingkat kepercayaan sumber</text>

  <!-- Solvers (decision layer, highlighted) -->
  <line x1="420" y1="460" x2="420" y2="500" stroke="#3A5ECF" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="100" y="500" width="640" height="110" rx="12" fill="#3A5ECF" fill-opacity="0.07" stroke="#3A5ECF" stroke-width="2.5"/>
  <text x="420" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#3A5ECF">4 Solver (kode — satu-satunya yang memutuskan)</text>
  <rect x="120" y="536" width="140" height="56" rx="8" fill="none" stroke="#3A5ECF" stroke-width="1.5"/>
  <text x="190" y="568" text-anchor="middle" font-size="11" fill="#3A5ECF">Verdict</text>
  <rect x="275" y="536" width="140" height="56" rx="8" fill="none" stroke="#3A5ECF" stroke-width="1.5"/>
  <text x="345" y="558" text-anchor="middle" font-size="11" fill="#3A5ECF">Claim</text>
  <text x="345" y="572" text-anchor="middle" font-size="11" fill="#3A5ECF">Allocation</text>
  <rect x="430" y="536" width="140" height="56" rx="8" fill="none" stroke="#3A5ECF" stroke-width="1.5"/>
  <text x="500" y="558" text-anchor="middle" font-size="11" fill="#3A5ECF">Recourse /</text>
  <text x="500" y="572" text-anchor="middle" font-size="11" fill="#3A5ECF">Adjudication Twin</text>
  <rect x="585" y="536" width="140" height="56" rx="8" fill="none" stroke="#3A5ECF" stroke-width="1.5"/>
  <text x="655" y="568" text-anchor="middle" font-size="11" fill="#3A5ECF">Plan Selection</text>

  <!-- ICD coder side input to solver -->
  <rect x="800" y="500" width="220" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="910" y="528" text-anchor="middle" font-size="12" font-weight="700">ICD-10 Coder</text>
  <text x="910" y="546" text-anchor="middle" font-size="10" fill="#6B7280">retrieve → select → verify</text>
  <text x="910" y="558" text-anchor="middle" font-size="10" fill="#6B7280">(hanya dari dokumen)</text>
  <line x1="800" y1="535" x2="740" y2="555" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PEP decision -->
  <line x1="420" y1="610" x2="420" y2="650" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M420 650 L510 700 L420 750 L330 700 Z" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="420" y="696" text-anchor="middle" font-size="12" font-weight="700">Permission</text>
  <text x="420" y="712" text-anchor="middle" font-size="12" font-weight="700">Enforcer</text>
  <text x="420" y="727" text-anchor="middle" font-size="9" fill="#6B7280">tingkat T0–T3, di kode</text>

  <line x1="330" y1="700" x2="140" y2="700" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="665" width="120" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="80" y="690" text-anchor="middle" font-size="11" font-weight="700">T0 / T1</text>
  <text x="80" y="705" text-anchor="middle" font-size="9" fill="#6B7280">baca & hitung</text>
  <text x="80" y="718" text-anchor="middle" font-size="9" fill="#6B7280">otomatis</text>

  <line x1="420" y1="750" x2="420" y2="790" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="330" y="790" width="180" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="420" y="814" text-anchor="middle" font-size="11" font-weight="700">T2 — Konfirmasi</text>
  <text x="420" y="830" text-anchor="middle" font-size="9" fill="#6B7280">klik user + nonce server</text>

  <line x1="510" y1="700" x2="700" y2="700" stroke="#D8313A" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="700" y="665" width="200" height="70" rx="8" fill="#D8313A" fill-opacity="0.07" stroke="#D8313A" stroke-width="1.5"/>
  <text x="800" y="690" text-anchor="middle" font-size="11" font-weight="700" fill="#D8313A">T3 — Uang/Identitas</text>
  <text x="800" y="705" text-anchor="middle" font-size="9" fill="#6B7280">tidak ada tool eksekusi —</text>
  <text x="800" y="718" text-anchor="middle" font-size="9" fill="#6B7280">tiket untuk manusia saja</text>

  <!-- Composer -->
  <line x1="80" y1="735" x2="80" y2="870" stroke="currentColor" stroke-width="2"/>
  <line x1="420" y1="850" x2="420" y2="870" stroke="currentColor" stroke-width="2"/>
  <line x1="80" y1="870" x2="420" y2="870" stroke="currentColor" stroke-width="2"/>
  <line x1="250" y1="870" x2="250" y2="900" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="900" width="340" height="70" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="250" y="928" text-anchor="middle" font-size="13" font-weight="700">Composer</text>
  <text x="250" y="946" text-anchor="middle" font-size="10" fill="#6B7280">LLM menulis; tiap angka/tanggal/ID</text>
  <text x="250" y="958" text-anchor="middle" font-size="10" fill="#6B7280">diverifikasi balik ke data solver</text>

  <line x1="420" y1="935" x2="490" y2="935" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
  <text x="455" y="925" text-anchor="middle" font-size="9" fill="#6B7280">jawaban</text>

  <!-- Audit log, side store -->
  <rect x="980" y="240" width="260" height="620" rx="10" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1110" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">Audit Log</text>
  <text x="1110" y="286" text-anchor="middle" font-size="10" fill="#6B7280">rantai hash, Supabase Postgres</text>
  <text x="1110" y="300" text-anchor="middle" font-size="10" fill="#6B7280">RLS tanpa kebijakan — hanya server menulis</text>

  <line x1="700" y1="275" x2="980" y2="340" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arrAudit)" stroke-dasharray="3 3"/>
  <line x1="740" y1="535" x2="980" y2="460" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arrAudit)" stroke-dasharray="3 3"/>
  <line x1="510" y1="700" x2="980" y2="560" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arrAudit)" stroke-dasharray="3 3"/>
  <line x1="900" y1="700" x2="980" y2="660" stroke="#6B7280" stroke-width="1.3" marker-end="url(#arrAudit)" stroke-dasharray="3 3"/>

  <text x="1110" y="930" text-anchor="middle" font-size="10" fill="#6B7280">LLM tidak pernah menulis langsung ke sini —</text>
  <text x="1110" y="946" text-anchor="middle" font-size="10" fill="#6B7280">hanya kode di tiap tahap yang mencatat.</text>
</svg>
